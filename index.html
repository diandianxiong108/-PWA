.chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:55vh}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:3px}
.chat-msg.ai{align-self:flex-start;background:var(--green-bg);color:var(--text);border-bottom-left-radius:3px}
.chat-suggest{align-self:flex-start;width:100%;background:var(--green-bg);border-radius:12px;padding:10px;border:1px solid var(--border)}
.chat-suggest-item{display:flex;align-items:center;gap:6px;padding:5px 0}
.chat-suggest-item+.chat-suggest-item{border-top:1px solid var(--border)}
.chat-suggest-info{flex:1;min-width:0}
.chat-suggest-title{font-size:13px;font-weight:500}
.chat-suggest-meta{font-size:10px;color:var(--text-l)}
.chat-add-btn{font-size:11px;padding:3px 10px;border-radius:6px;border:none;background:var(--green);color:#fff;cursor:pointer;flex-shrink:0}
.chat-add-btn.done{background:var(--text-l)}
.chat-typing{align-self:flex-start;display:flex;gap:3px;padding:10px 14px;background:var(--green-bg);border-radius:12px;border-bottom-left-radius:3px}
.chat-typing span{width:5px;height:5px;background:#d0dcd0;border-radius:50%;animation:typing 1.2s infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.chat-input-wrap{display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-wrap input{flex:1;padding:8px 12px;font-size:14px;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--green-bg)}
.chat-input-wrap input:focus{border-color:var(--green);background:#fff}
.chat-send-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.title[contenteditable="true"]{outline:none;border-bottom:1px dashed var(--border)}
.summary-popup{position:fixed;inset:0;z-index:250;background:rgba(44,62,45,.4);display:none;align-items:center;justify-content:center;padding:20px}
.summary-popup.show{display:flex}
.summary-popup .box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:60vh;overflow-y:auto}
.summary-popup .box h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.summary-popup .box p{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.summary-popup .box .close-btn{margin-top:10px;padding:6px 16px;border-radius:8px;border:none;background:var(--border);cursor:pointer;font-size:12px}
</style>

function loadSprites(cb){
  let loaded=0;
  SPRITE_FILES.forEach((f,i)=>{
    const img=new Image();
    img.onload=()=>{loaded++;document.getElementById('loadingSub').textContent=`加载图标 ${loaded}/${SPRITE_FILES.length}`;if(loaded>=SPRITE_FILES.length){spritesReady=true;cb()}};
    img.onerror=()=>{loaded++;if(loaded>=SPRITE_FILES.length){spritesReady=true;cb()}};
    img.src=f;
  });
  setTimeout(()=>{if(!spritesReady){spritesReady=true;cb()}},5000);
}

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function createCalendarEvent(task,dateOverride){
  if(!task)return null;
  const taskDate=dateOverride||task.scheduledDate||todayStr();
  const startTime=task.scheduledStart||task.plannedStart||task.alarmTime||'09:00';
  const endTime=task.scheduledEnd||task.plannedEnd||shiftMinutes(startTime,60);
  const startIso=taskDate+'T'+startTime+':00';
  const endIso=taskDate+'T'+endTime+':00';
  const summary=(task.title||'任务').replace(/\r?\n/g,' ').trim();
  const description=[task.type?`类型：${task.type}`:'',task.timeLabel?`时段：${task.timeLabel}`:'',task.important?'提醒级别：重要闹钟':'提醒级别：普通通知'].filter(Boolean).join('\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','SUMMARY:'+summary,'DTSTART:'+startIso.replace(/[-:]/g,''),'DTEND:'+endIso.replace(/[-:]/g,''),description?'DESCRIPTION:'+description.replace(/\n/g,'\\n'):'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\n');

}
function shiftMinutes(timeText,minutes){const[h,m]=(timeText||'09:00').split(':').map(Number);const total=(h||0)*60+(m||0)+minutes;const fixed=((total%1440)+1440)%1440;return`${String(Math.floor(fixed/60)).padStart(2,'0')}:${String(fixed%60).padStart(2,'0')}`}
function downloadICS(id,dateOverride){
  const t=appData.tasks.find(t=>t.id===id);if(!t)return;

  const ics=event.ics;
  const b=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  if(navigator.share&&typeof File!=='undefined'){navigator.share({title:event.title,files:[new File([ics],event.title+'.ics',{type:'text/calendar'})]}).catch(()=>{})}
  else{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=event.title+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},100)}
}

function shouldShowDaily(task){
  const base=new Date('2026-01-01'),today=new Date();today.setHours(0,0,0,0);const diff=Math.floor((today-base)/86400000);
  switch(task.frequency){
    case'每天':return true;case'隔天':return diff%2===0;case'每3天':return diff%3===0;case'工作日':{const d=today.getDay();return d>=1&&d<=5}
    case'自定义':{const d=today.getDay(),map=[7,1,2,3,4,5,6];return(task.customDays||[]).includes(map[d])}default:return true
  }
}
function getCyclicNext(t){if(!t.lastDoneDate)return todayStr();const d=new Date(t.lastDoneDate);d.setDate(d.getDate()+(t.cycleDays||1));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function calcTempScore(t){
  let s=(4-(t.priority||2))*2;if(t.duration)s+=Math.max(0,(60-t.duration)/10);

  const d=daysUntil(t.deadline);if(d!==null){if(d<0)s+=10;else s+=(7-d)*3}return s;
}

function getWeekDays(o){const t=new Date();t.setHours(0,0,0,0);const d=t.getDay()||7;const m=new Date(t);m.setDate(t.getDate()-(d-1)+o*7);const r=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);r.push(d)}return r}
function getTasksForDate(date){
  const ds=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const today=todayStr();
  const r=[];
  appData.tasks.forEach(t=>{
    if(t.type==='每日'&&shouldShowDaily(t)&&!t.completedToday&&ds===today)r.push({color:'#64b5f6',title:t.title});
    else if(t.type==='循环'){const n=getCyclicNext(t);if(ds>=n)r.push({color:'#81c784',title:t.title})}
    else if(t.type==='临时'&&!t.hiddenToday){if(t.scheduledDate){if(ds===t.scheduledDate)r.push({color:'#ffb74d',title:t.title})}else if(t.deadline){const d=daysUntil(t.deadline);if(d!==null&&d>=0)r.push({color:'#ffb74d',title:t.title})}}
    else if(t.type==='项目'){if((t.steps||[]).filter(s=>!s.done).length&&ds===today)r.push({color:'#ce93d8',title:t.title})}
  });
  return r;
}

function handleQuickAdd(){

  if(!task.scheduledStart&&type==='临时')task.scheduledDate=todayStr();
  if(task.scheduledStart&&!task.alarmTime){const[h,m]=task.scheduledStart.split(':').map(Number);const totalMin=h*60+m-60;const ah=Math.floor(((totalMin%1440)+1440)%1440/60);const am=((totalMin%60)+60)%60;task.alarmTime=`${String(ah).padStart(2,'0')}:${String(am).padStart(2,'0')}`}
  switch(type){
    case'每日':task.frequency='每天';task.subtask='';task.completedToday=false;task.lastCompletedDate=null;task.remindBefore=null;task.departureTime=null;break;
    case'项目':task.steps=[{id:genId(),title:'第一步',duration:30,done:false}];task.reminderTime='22:30';task.isTiming=false;task.startTime=null;task.remindBefore=null;task.departureTime=null;break;

    case'del-inspire':{if(confirm('确定删除？')){appData.inspirations=appData.inspirations.filter(i=>i.id!==id);render();toJSONBin()}break}

// Health
function renderHealth(){
  const c=document.getElementById('healthList');const m=appData.menstrual;
  // Calculate cycle info from history
  function calcCycleStats(){
    const h=m.history.filter(x=>x.end);if(h.length<2)return null;
    const intervals=[];for(let i=1;i<h.length;i++)intervals.push(Math.round((new Date(h[i].start)-new Date(h[i-1].start))/86400000));
    const durations=h.map(x=>x.duration).filter(d=>d);
    const sortedI=[...intervals].sort((a,b)=>a-b),sortedD=[...durations].sort((a,b)=>a-b);
    const midI=sortedI[Math.floor(sortedI.length/2)],midD=sortedD[Math.floor(sortedD.length/2)];
    return {intervals,durations,medianCycle:midI,medianPeriod:midD,count:h.length};
  }
  const stats=calcCycleStats();
  const calcCycle=stats?stats.medianCycle:m.cycleDays;
  const calcPeriod=stats?stats.medianPeriod:m.periodDays;

  let html='<div class="health-card">';
  html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span class="caticon">${iconImg('月经')}</span><span style="font-weight:600;font-size:14px">🩸 月经周期</span></div>`;
  if(m.lastPeriodStart){
    const start=new Date(m.lastPeriodStart);const daysSince=Math.floor((new Date()-start)/86400000);const dayInCycle=daysSince%calcCycle;const inPeriod=dayInCycle<calcPeriod;
    const nextP=new Date(start);nextP.setDate(start.getDate()+calcCycle);const dtn=calcCycle-dayInCycle;
    html+=`<div class="row"><span class="label">${iconImg('日历')}上次开始</span><span class="val">${fmtDate(m.lastPeriodStart)}</span></div>`;
    html+=`<div class="row"><span class="label">周期/经期</span><span class="val">${stats?`${calcCycle}天(推算)/${calcPeriod}天(推算)`:`${calcCycle}天(设置)/${calcPeriod}天(设置)`}</span></div>`;
    if(inPeriod){const pd=dayInCycle+1;
      html+=`<div class="row"><span class="label" style="color:#d81b60">🩸 经期中</span><span class="val" style="color:#d81b60">第${pd}天</span></div>`;
      html+=`<div class="bar-wrap">${Array.from({length:calcPeriod},(_,i)=>`<span class="seg ${i<pd?'on':'off'}"></span>`).join('')}</div>`;
      html+=`<div class="reminder-toggle"><input type="checkbox" class="switch" id="menstrualRemind" ${m.notifications?'checked':''}><span>每4小时更换提醒 ${m.notifications?'(活跃中)':'(已关闭)'}</span></div>`;
    }else{
      html+=`<div class="row"><span class="label">预计下次</span><span class="val">${fmtDate(nextP.toISOString())}（${dtn}天后）</span></div>`;
      if(stats&&stats.intervals.length>=1){const lc=stats.intervals[stats.intervals.length-1];html+=`<div class="row"><span class="label">规律性</span><span class="val">${Math.abs(lc-calcCycle)<=2?'规律 ✅':'波动中 ⚠️'}</span></div>`}
    }
    if(m.history.length){html+=`<details style="margin-top:6px;font-size:12px"><summary style="color:var(--text-l);cursor:pointer">历史记录 (${m.history.length})</summary>`;m.history.slice().reverse().slice(0,6).forEach(h=>{html+=`<div style="padding:3px 0;color:var(--text-l)">${h.start} → ${h.end||'进行中'} (${h.duration||'?'}天)</div>`});html+=`</details>`}
  }else{html+=`<div style="font-size:13px;color:var(--text-l);margin-bottom:8px">尚未记录月经周期</div>`}
  html+=`<div class="btn-group"><button class="primary" data-action="period-start">📅 记录开始</button>`;if(m.lastPeriodStart)html+=`<button data-action="period-end">📅 记录结束</button>`;if(m.history.length>=2)html+=`<button data-action="period-chart">📊 查看规律</button>`;html+=`<button data-action="period-settings">⚙️ 设置</button></div>`;
  // Hourly
  html+=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span class="caticon">${iconImg('提醒')}</span><span style="font-weight:600;font-size:14px">⏰ 定时提醒</span></div>`;
  html+=`<div class="hourly-item"><div class="info"><div class="title">🪑 久坐提醒</div><div class="sub">每3小时起来活动</div></div><input type="checkbox" class="switch" id="sedentaryToggle"></div>`;
  appData.tasks.filter(t=>t.type==='定时').forEach(task=>{html+=`<div class="hourly-item"><div class="info"><div class="title">${task.title}</div><div class="sub">每${task.intervalHours}小时提醒</div></div><input type="checkbox" class="switch" data-hid="${task.id}" ${task.isActive?'checked':''}></div>`});
  html+=`<div style="margin-top:6px"><button data-action="add-hourly" style="font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fafcfa;cursor:pointer">＋ 添加定时提醒</button></div></div></div>`;
  c.innerHTML=html;
}

function showPeriodChart(){
  const m=appData.menstrual;const h=m.history.filter(x=>x.end);if(h.length<2){alert('需要至少2次完整记录才能分析规律');return}
  const intervals=[];for(let i=1;i<h.length;i++)intervals.push({label:h[i].start.slice(5),days:Math.round((new Date(h[i].start)-new Date(h[i-1].start))/86400000)});
  const maxDays=Math.max(...intervals.map(x=>x.days));const minDays=Math.min(...intervals.map(x=>x.days));
  const sorted=[...intervals].map(x=>x.days).sort((a,b)=>a-b);const median=sorted[Math.floor(sorted.length/2)];
  const barH=160;const w=Math.min(300,intervals.length*55+20);
  let bars=intervals.map((d,i)=>{
    const pct=Math.max(8,d.days/maxDays*100);const color=Math.abs(d.days-median)<=2?'#7bc47f':'#ef5350';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1"><div style="width:28px;height:${pct}%;background:${color};border-radius:4px 4px 0 0;min-height:8px;transition:height .3s" title="${d.days}天"></div><span style="font-size:9px;color:var(--text-l);white-space:nowrap">${d.label}</span><span style="font-size:10px;font-weight:600">${d.days}天</span></div>`
  }).join('');
  const medianLine=`<div style="position:absolute;left:0;right:0;top:${100-(median/maxDays*100)}%;border-top:2px dashed #7bc47f;opacity:.5"><span style="position:absolute;right:0;top:-14px;font-size:10px;color:#7bc47f;background:#fff;padding:0 4px">中位数${median}天</span></div>`;
  const popup=document.createElement('div');popup.style.cssText='position:fixed;inset:0;z-index:250;background:rgba(44,62,45,.4);display:flex;align-items:center;justify-content:center;padding:20px';
  popup.innerHTML=`<div style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:70vh;overflow-y:auto"><h3 style="font-size:15px;margin-bottom:10px">📊 周期规律分析</h3><p style="font-size:12px;color:var(--text-l);margin-bottom:10px">最近${intervals.length}次周期间隔，中位数${median}天${intervals.every(d=>Math.abs(d.days-median)<=2)?' ✅ 非常规律':' ⚠️ 有波动'}</p><div style="position:relative;height:${barH}px;display:flex;align-items:flex-end;gap:4px;padding:0 4px;margin-bottom:4px">${medianLine}${bars}</div><div style="display:flex;gap:12px;font-size:11px;color:var(--text-l);margin-top:8px"><span><span style="display:inline-block;width:10px;height:10px;background:#7bc47f;border-radius:2px;vertical-align:middle;margin-right:3px"></span>规律(±2天)</span><span><span style="display:inline-block;width:10px;height:10px;background:#ef5350;border-radius:2px;vertical-align:middle;margin-right:3px"></span>波动</span></div><button onclick="this.closest('div[style]').remove()" style="margin-top:12px;padding:6px 16px;border-radius:8px;border:none;background:var(--border);cursor:pointer;font-size:12px">关闭</button></div>`;
  document.body.appendChild(popup);
  popup.addEventListener('click',e=>{if(e.target===popup)popup.remove()});
}

const BADGE_DEFS=[
  {id:'first',title:'🥇 初次启程',desc:'完成第一个任务',icon:'🥇'},
  {id:'week7',title:'🔥 连续7天',desc:'连续7天完成每日任务',icon:'🔥'},
  {id:'total100',title:'💯 百炼成钢',desc:'累计完成100个任务',icon:'💯'},
  {id:'fullweek',title:'📅 周全勤',desc:'本周每天都有完成任务',icon:'📅'},
  {id:'cycles5',title:'🔄 循环达人',desc:'准时完成5次循环任务',icon:'🔄'},
  {id:'projects3',title:'🚀 项目狂人',desc:'完成3个项目',icon:'🚀'},
];
const STAR_LEVELS=[
  {level:1,points:50,title:'⭐ 新星',icon:'⭐'},
  {level:2,points:200,title:'⭐⭐ 新星',icon:'⭐⭐'},
  {level:3,points:500,title:'⭐⭐⭐ 新星',icon:'⭐⭐⭐'},
  {level:4,points:1000,title:'⭐⭐⭐⭐ 新星',icon:'⭐⭐⭐⭐'},
  {level:5,points:2000,title:'⭐⭐⭐⭐⭐ 新星',icon:'⭐⭐⭐⭐⭐'},
];
function calculateTotalPoints(){
  let pts=0;
  appData.tasks.forEach(t=>{
    if(t.type==='每日'&&t.lastCompletedDate)pts++;
    else if(t.type==='循环'&&t.lastDoneDate)pts++;
    else if(t.type==='项目'&&t.steps&&t.steps.length&&t.steps.every(s=>s.done))pts++;
  });
  return pts;
}
function showAchievementNotification(msg){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s';
  const bx=document.createElement('div');

  bx.innerHTML=`<div style="font-size:48px;margin-bottom:12px">🎉</div><div style="font-size:16px;font-weight:600;color:var(--green-d);white-space:pre-wrap;margin-bottom:16px">${msg}</div><button onclick="this.closest('div[style]').remove()" style="padding:8px 24px;border-radius:10px;border:none;background:var(--green);color:#fff;cursor:pointer;font-size:14px">太棒了！</button>`;

  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});

function checkBadges(){
  const owned=new Set((appData.badges||[]).map(b=>b.id));
  const now=todayStr();const weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay()+1);
  const stats={
    completedCount:appData.tasks.filter(t=>t.type==='每日'&&t.completedToday).length,
    totalDone:appData.tasks.filter(t=>t.type==='每日'&&t.lastCompletedDate).length+appData.tasks.filter(t=>t.type==='循环'&&t.lastDoneDate).length,
    weekComplete:appData.tasks.filter(t=>t.type==='每日'&&t.completedToday).length>=3,
    cyclesOnTime:appData.tasks.filter(t=>t.type==='循环'&&t.lastDoneDate).length,
    projectsDone:appData.tasks.filter(t=>t.type==='项目'&&t.steps&&t.steps.every(s=>s.done)).length,
  };
  let newBadges=[];
  BADGE_DEFS.forEach(def=>{
    if(owned.has(def.id))return;let earned=false;
    if(def.id==='first'&&stats.completedCount>=1)earned=true;
    if(def.id==='week7'&&stats.totalDone>=7)earned=true;
    if(def.id==='total100'&&stats.totalDone>=100)earned=true;
    if(def.id==='fullweek'&&stats.weekComplete)earned=true;
    if(def.id==='cycles5'&&stats.cyclesOnTime>=5)earned=true;
    if(def.id==='projects3'&&stats.projectsDone>=3)earned=true;
    if(earned){appData.badges.push({id:def.id,title:def.title,desc:def.desc,earnedAt:now});newBadges.push(def)}
  });
  newBadges.forEach(b=>{setTimeout(()=>showAchievementNotification(`🏅 获得勋章！\n${b.icon} ${b.title}\n${b.desc}`),100)});
  // Star level check (after all basic badges)
  const totalPts=calculateTotalPoints();
  const curStars=appData.stars||0;
  let maxStar=0;
  STAR_LEVELS.forEach(sl=>{if(totalPts>=sl.points)maxStar=sl.level});
  if(maxStar>curStars){
    appData.stars=maxStar;
    for(let lvl=curStars+1;lvl<=maxStar;lvl++){
      const sl=STAR_LEVELS.find(s=>s.level===lvl);
      if(sl)setTimeout(()=>showAchievementNotification(`⭐ 达成星级里程碑！\n${sl.icon} ${sl.title}\n累积完成 ${sl.points} 个任务！`),400*(lvl-curStars));
    }
    toJSONBin();
  }
  if(newBadges.length||maxStar>curStars){renderBadges();toJSONBin()}
}
function renderBadges(){
  const c=document.getElementById('badgeList');const owned=appData.badges||[];
  const totalPts=calculateTotalPoints();const curStars=appData.stars||0;
  const cnt=document.getElementById('badgeCount');
  if(cnt)cnt.textContent=owned.length+'/'+BADGE_DEFS.length+(curStars>0?' ⭐'+curStars:'');
  let html='<div class="card" style="padding:12px 14px">';
  // Badges grid
  html+='<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px">🏅 成就勋章</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">';
  BADGE_DEFS.forEach(def=>{
    const has=owned.find(b=>b.id===def.id);
    html+=`<div style="width:80px;text-align:center;padding:8px 4px;border-radius:10px;background:${has?'var(--green-l)':'var(--border)'};opacity:${has?'1':'.4'}"><div style="font-size:24px">${def.icon}</div><div style="font-size:10px;color:var(--text);margin-top:4px;font-weight:${has?'600':'400'}">${def.title}</div>${has?`<div style="font-size:8px;color:var(--text-l)">${has.earnedAt}</div>`:'<div style="font-size:8px;color:#bbb">未获得</div>'}</div>`;
  });
  html+='</div>';
  // Star levels progress
  html+='<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">';
  html+='<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px">⭐ 星级里程碑</div>';
  const nextStar=STAR_LEVELS.find(sl=>sl.level>curStars);
  if(nextStar){
    const progress=Math.min(100,(totalPts/nextStar.points)*100);
    html+=`<div style="margin-bottom:6px;font-size:11px;color:var(--text-l)">目前 ${totalPts} / ${nextStar.points} 分 → ${nextStar.icon} ${nextStar.title}</div>`;
    html+=`<div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#ffd700,#ffaa00);border-radius:4px;transition:width .5s"></div></div>`;
  }else if(curStars>=5){
    html+=`<div style="font-size:12px;color:var(--green-d);margin-bottom:8px">🌟 已达成最高星级！累计 ${totalPts} 分</div>`;
  }
  STAR_LEVELS.filter(sl=>sl.level<=curStars).forEach(sl=>{
    html+=`<div style="display:inline-block;padding:4px 10px;border-radius:8px;background:var(--green-l);margin:2px;font-size:12px">${sl.icon} ${sl.title}</div>`;
  });
  html+='</div></div>';c.innerHTML=html;
}

// ====== Wishes ======
function renderWishes(){
  const c=document.getElementById('wishList');const items=appData.wishes||[];
  const cnt=document.getElementById('wishCount');if(cnt)cnt.textContent=items.length;
  let html='<div class="card" style="padding:12px 14px">';
  html+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><input type="text" id="wishName" placeholder="愿望名称" style="flex:1;min-width:80px;padding:6px 8px;font-size:13px;border:1px solid var(--border);border-radius:8px;outline:none"><input type="number" id="wishTarget" placeholder="目标金额" style="width:80px;padding:6px 8px;font-size:13px;border:1px solid var(--border);border-radius:8px;outline:none"><button onclick="addWish()" style="padding:6px 12px;border-radius:8px;border:none;background:var(--green);color:#fff;cursor:pointer;font-size:13px">＋添加愿望</button></div>`;
  if(!items.length)html+=`<div class="empty-tip" style="padding:8px 0">暂无愿望</div>`;
  else{
    items.forEach(w=>{
      const pct=Math.min(100,w.targetAmount>0?Math.round(w.currentAmount/w.targetAmount*100):0);
      html+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:6px"><span style="flex:1;font-weight:500">${esc(w.title)}</span><span style="font-size:12px;color:var(--text-l)">¥${w.currentAmount}/¥${w.targetAmount}</span></div><div style="margin:4px 0;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct>=100?'var(--green)':'var(--blue)'};border-radius:4px;transition:width .3s"></div></div><div style="display:flex;gap:6px;align-items:center;font-size:12px">${pct>=100?'<span style="color:var(--green)">✅ 已达标！</span>':''}<input type="number" id="wishAdd-${w.id}" placeholder="金额" style="width:70px;padding:3px 6px;font-size:12px;border:1px solid var(--border);border-radius:6px"><button onclick="addWishAmount('${w.id}')" style="font-size:11px;padding:3px 8px;border-radius:6px;border:none;background:var(--green-l);color:var(--green-d);cursor:pointer">+ 存钱</button><button onclick="deleteWish('${w.id}')" style="font-size:11px;padding:3px 8px;border-radius:6px;border:none;background:var(--pink-l);color:#d81b60;cursor:pointer;margin-left:auto">✕</button></div></div>`;
    });
  }
  html+=`</div>`;c.innerHTML=html;
}
function addWish(){
  const title=document.getElementById('wishName').value.trim();if(!title){alert('请输入愿望名称');return}
  const target=parseFloat(document.getElementById('wishTarget').value);if(!target||target<=0){alert('请输入有效目标金额');return}
  appData.wishes.push({id:genId(),title,targetAmount:target,currentAmount:0,createdAt:todayStr()});
  document.getElementById('wishName').value='';document.getElementById('wishTarget').value='';renderWishes();toJSONBin();
}
function addWishAmount(id){
  const inp=document.getElementById('wishAdd-'+id);if(!inp)return;
  const amt=parseFloat(inp.value);if(!amt||amt<=0)return;
  const w=appData.wishes.find(x=>x.id===id);if(!w)return;
  w.currentAmount+=amt;inp.value='';renderWishes();toJSONBin();
  if(w.currentAmount>=w.targetAmount)setTimeout(()=>alert(`🎉 恭喜达成愿望「${w.title}」！`),100);
}
function deleteWish(id){if(!confirm('删除此愿望？'))return;appData.wishes=appData.wishes.filter(w=>w.id!==id);renderWishes();toJSONBin()}

// Hourly check (every minute)
setInterval(()=>{
  const now=new Date();const timeStr=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const sed=document.getElementById('sedentaryToggle');
  if(sed&&sed.checked){const last=localStorage.getItem('sedentaryLastNotified');if(!last||(now-new Date(last))/3600000>=3){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:'🪑 起来活动一下！'});localStorage.setItem('sedentaryLastNotified',now.toISOString())}}
  const m=appData.menstrual;
  if(m.lastPeriodStart&&m.notifications){const ds=Math.floor((now-new Date(m.lastPeriodStart))/86400000);const dc=ds%m.cycleDays;if(dc<m.periodDays){const last=localStorage.getItem('menstrualLastNotified');if(!last||(now-new Date(last))/3600000>=4){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:'🩸 该更换卫生巾了'});localStorage.setItem('menstrualLastNotified',now.toISOString())}}}
  appData.tasks.filter(t=>t.type==='定时'&&t.isActive).forEach(task=>{const last=task.lastNotifiedAt;if(!last||(now-new Date(last))/3600000>=task.intervalHours){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:`⏰ ${task.title}`});task.lastNotifiedAt=now.toISOString();toJSONBin()}});
  // scheduledStart notifications
  if(appData.settings&&appData.settings.notifications!==false){appData.tasks.filter(t=>t.scheduledStart&&t.scheduledStart===timeStr).forEach(task=>{const key='notif_'+task.id+'_'+todayStr();if(!localStorage.getItem(key)){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:`⏰ ${task.title} 该开始了！`});try{navigator.vibrate(200)}catch(e){}localStorage.setItem(key,'1')}})}
  // remindBefore check
  appData.tasks.filter(t=>t.scheduledStart&&t.remindBefore).forEach(task=>{const[h,m]=task.scheduledStart.split(':').map(Number);const totalMin=h*60+m;const remindMin=totalMin-task.remindBefore;if(remindMin>=0){const remindH=Math.floor(remindMin/60);const remindM=remindMin%60;const remindStr=`${String(remindH).padStart(2,'0')}:${String(remindM).padStart(2,'0')}`;if(timeStr===remindStr){const key='remind_'+task.id+'_'+todayStr();if(!localStorage.getItem(key)){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:`${task.title} 将在${task.remindBefore}分钟后开始`});try{navigator.vibrate(200)}catch(e){}localStorage.setItem(key,'1')}}}})
  // departureTime check
  appData.tasks.filter(t=>t.departureTime&&t.duration).forEach(task=>{if(timeStr===task.departureTime){const key='depart_'+task.id+'_'+todayStr();if(!localStorage.getItem(key)){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:`该出发去${task.title}了，预计路程${task.duration}分钟`});try{navigator.vibrate(200)}catch(e){}localStorage.setItem(key,'1')}}})
  // Temp task alarms
  appData.tasks.filter(t=>t.type==='临时'&&t.alarmTime&&!t.hiddenToday).forEach(task=>{if(task.alarmTime===timeStr){const key='alarm_'+task.id+'_'+todayStr();if(!localStorage.getItem(key)){if('Notification'in window&&Notification.permission==='granted')new Notification('任务管家',{body:`⏰ ${task.title} 时间到了！`});try{navigator.vibrate(200)}catch(e){}localStorage.setItem(key,'1')}}})
},60000);

// AI Chat
const chatFab=document.getElementById('chatFab'),chatOverlay=document.getElementById('chatOverlay'),chatClose=document.getElementById('chatClose');
const chatMsgs=document.getElementById('chatMessages'),chatInput=document.getElementById('chatInput'),chatSend=document.getElementById('chatSend');
try{const saved=localStorage.getItem('task-chat-history');if(saved){const p=JSON.parse(saved);if(Array.isArray(p))chatHistory=p}chatRound=parseInt(localStorage.getItem('task-chat-round')||'0')}catch(e){}
chatFab.addEventListener('click',()=>{chatOverlay.classList.add('show');chatInput.focus()});
chatClose.addEventListener('click',()=>chatOverlay.classList.remove('show'));
chatOverlay.addEventListener('click',e=>{if(e.target===chatOverlay)chatOverlay.classList.remove('show')});
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
chatSend.addEventListener('click',sendChat);
document.getElementById('chatNewBtn').addEventListener('click',()=>{if(!confirm('确定开始新对话？'))return;chatHistory=[];chatRound=0;localStorage.setItem('task-chat-history','[]');localStorage.setItem('task-chat-round','0');chatMsgs.innerHTML='<div class="chat-msg ai">新对话开始啦～</div>'});
document.getElementById('chatSummaryBtn').addEventListener('click',()=>{document.getElementById('summaryText').textContent=localStorage.getItem('task-chat-summary')||'暂无摘要';document.getElementById('summaryPopup').classList.add('show')});
async function sendChat(){
  const t=chatInput.value.trim();if(!t)return;chatInput.value='';
  addBubble(t,'user');chatHistory.push({role:'user',content:t});chatRound++;
  const ty=document.createElement('div');ty.className='chat-typing';ty.innerHTML='<span></span><span></span><span></span>';ty.id='chatTyping';chatMsgs.appendChild(ty);chatMsgs.scrollTop=chatMsgs.scrollHeight;
  try{
    let summary=localStorage.getItem('task-chat-summary')||'';
    const memoryContext=window.AIMemorySystem?window.AIMemorySystem.buildPrompt(appData):summary;
    if(chatRound%8===0&&chatRound>0){
      try{const sr=await fetch('/.netlify/functions/ai-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:'这是我授权保存的跨对话记忆，请作为规划前提：\n'+memoryContext},...chatHistory.slice(-10),{role:'user',content:'请压缩总结本周对话中的目标、决定、未完成事项，不要重复长期习惯'}],memoryContext})});if(sr.ok){const sd=await sr.json();summary=sd.message||summary;localStorage.setItem('task-chat-summary',summary);window.AIMemorySystem?.weeklySummary.addConversationDigest(summary)}}catch(e){}
      chatHistory=chatHistory.slice(-2);chatRound=0;addBubble('📝 已总结习惯，继续畅聊～','ai');
    }
    const res=await fetch('/.netlify/functions/ai-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:'这是我授权保存的跨对话记忆，请作为规划前提，不要让我重复说明：\n'+memoryContext},...chatHistory.slice(-8)],existingTasks:appData.tasks,memoryContext})});
    document.getElementById('chatTyping')?.remove();if(!res.ok)throw new Error();
    const data=await res.json(),msg=data.message.replace(/```json[\s\S]*?```/g,'').trim()||data.message;
    addBubble(msg,'ai');chatHistory.push({role:'assistant',content:msg});
    if(data.suggestedTasks&&data.suggestedTasks.length){const sd=document.createElement('div');sd.className='chat-suggest';sd.innerHTML=data.suggestedTasks.map(t=>`<div class="chat-suggest-item"><div class="chat-suggest-info"><div class="chat-suggest-title">${t.title||''}</div><div class="chat-suggest-meta">${t.type||''}</div></div><button class="chat-add-btn" data-chat-add='${esc(JSON.stringify(t))}'>✅ 添加</button></div>`).join('');chatMsgs.appendChild(sd)}
    localStorage.setItem('task-chat-history',JSON.stringify(chatHistory.slice(-30)));localStorage.setItem('task-chat-round',String(chatRound));
  }catch(e){document.getElementById('chatTyping')?.remove();addBubble('遇到问题了，稍后再试','ai')}
}
function addBubble(text,role){const d=document.createElement('div');d.className=`chat-msg ${role}`;d.textContent=text;chatMsgs.appendChild(d);chatMsgs.scrollTop=chatMsgs.scrollHeight}
document.addEventListener('click',e=>{const b=e.target.closest('[data-chat-add]');if(!b)return;try{const td=JSON.parse(b.dataset.chatAdd),nt={...td,id:genId()};if(nt.type==='每日'){nt.completedToday=false;nt.lastCompletedDate=null}else if(nt.type==='项目'){nt.steps=(nt.steps||[]).map(s=>({...s,id:genId(),done:false}));nt.reminderTime=nt.reminderTime||'22:30';nt.isTiming=false;nt.startTime=null}else if(nt.type==='循环'){nt.lastDoneDate=nt.lastDoneDate||todayStr()}else if(nt.type==='临时'){nt.hiddenToday=false;nt.deadlineConfirmed=nt.deadlineConfirmed!==false}else if(nt.type==='灵感'){appData.inspirations.push({id:genId(),text:nt.text,date:todayStr()});renderInspirations();toJSONBin();b.textContent='✅ 已添加';b.classList.add('done');return}addTask(nt);b.textContent='✅ 已添加';b.classList.add('done')}catch(e){}});

// Init
if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();
// SW registration with update detection
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDailyReset()});
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const sw=reg.installing;
      sw.addEventListener('statechange',()=>{
        if(sw.state==='installed'&&navigator.serviceWorker.controller){
          if(confirm('应用有更新，是否立即刷新？'))window.location.reload(true);
        }
      });
    });
  }).catch(()=>{});
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    if(confirm('应用有更新，是否立即刷新？'))window.location.reload(true);
  });
}

function saveExtra(){const inp=document.getElementById('extraInput'),text=inp.value.trim();if(!text)return;const type=document.getElementById('extraType').value;const duration=parseInt(document.getElementById('extraDuration').value)||null;const timeSlot=document.getElementById('extraTimeSlot').value||null;const task={id:genId(),type,title:text,scheduledStart:null,scheduledEnd:null,timeLabel:timeSlot,alarmTime:null,scheduledDate:null};if(type==='每日'){task.frequency='每天';task.subtask='';task.completedToday=true;task.lastCompletedDate=todayStr()}else if(type==='临时'){task.deadline=null;task.deadlineConfirmed=false;task.hiddenToday=false;task.priority=2;task.duration=duration}else if(type==='项目'){task.steps=[{id:genId(),title:text,duration:duration||30,done:true}];task.reminderTime='22:30';task.isTiming=false;task.startTime=null}else if(type==='随手记'){appData.notes.push({id:genId(),title:'',text:text,date:todayStr(),createdAt:new Date().toISOString(),pinned:false,done:true});inp.value='';document.getElementById('extraDuration').value='';document.getElementById('extraTimeSlot').value='';renderExtra();toJSONBin();return}appData.tasks.push(task);inp.value='';document.getElementById('extraDuration').value='';document.getElementById('extraTimeSlot').value='';render();toJSONBin()}
function renderExtra(){const items=(appData.notes||[]).filter(n=>n.done&&n.date===todayStr());const cnt=document.getElementById('extraCount');if(cnt)cnt.textContent=items.length;const list=document.getElementById('extraList');if(!items.length){if(list)list.innerHTML='<div class="empty-tip" style="padding:4px 0;font-size:12px">暂无</div>';return}if(list)list.innerHTML=items.slice(0,5).map(i=>'<div style="padding:4px 8px;font-size:12px;color:var(--text-l);border-bottom:1px solid var(--border)">📝 '+esc(i.text)+'</div>').join('')+(items.length>5?'<div style="padding:4px 8px;font-size:11px;color:#bbb">还有'+(items.length-5)+'条...</div>':'')}
