.chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-header .left{display:flex;align-items:center;gap:6px}
.chat-header h2{font-size:15px;font-weight:600}
.chat-toolbar{display:flex;gap:4px}
.chat-toolbar button{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:#fafcfa;cursor:pointer;color:var(--text-l);display:flex;align-items:center;gap:3px}
.chat-close{font-size:18px;color:#d0dcd0;cursor:pointer;background:none;border:none;padding:2px 6px}
.chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:55vh}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:3px}
.chat-msg.ai{align-self:flex-start;background:var(--green-bg);color:var(--text);border-bottom-left-radius:3px}
.chat-suggest{align-self:flex-start;width:100%;background:var(--green-bg);border-radius:12px;padding:10px;border:1px solid var(--border)}
.chat-suggest-item{display:flex;align-items:center;gap:6px;padding:5px 0}
.chat-suggest-item+.chat-suggest-item{border-top:1px solid var(--border)}
.chat-suggest-info{flex:1;min-width:0}
.chat-suggest-title{font-size:13px;font-weight:500}
.chat-suggest-meta{font-size:10px;color:var(--text-l)}
.chat-add-btn{font-size:11px;padding:3px 10px;border-radius:6px;border:none;background:var(--green);color:#fff;cursor:pointer;flex-shrink:0}
.chat-add-btn.done{background:var(--text-l)}
.chat-typing{align-self:flex-start;display:flex;gap:3px;padding:10px 14px;background:var(--green-bg);border-radius:12px;border-bottom-left-radius:3px}
.chat-typing span{width:5px;height:5px;background:#d0dcd0;border-radius:50%;animation:typing 1.2s infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.chat-input-wrap{display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-wrap input,.chat-input-wrap textarea{flex:1;padding:8px 12px;font-size:14px;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--green-bg)}
.chat-input-wrap input:focus,.chat-input-wrap textarea:focus{border-color:var(--green);background:#fff}
.chat-send-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.title[contenteditable="true"]{outline:none;border-bottom:1px dashed var(--border)}
.summary-popup{position:fixed;inset:0;z-index:250;background:rgba(44,62,45,.4);display:none;align-items:center;justify-content:center;padding:20px}
.summary-popup.show{display:flex}
.summary-popup .box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:60vh;overflow-y:auto}
.task-time-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:12px;color:var(--text-l)}
.task-time-row .time-input{font-size:12px;padding:2px 6px;border:1px solid var(--border);border-radius:6px;width:72px;max-width:86px}
.task-time-row .mini-time-input{font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;width:72px}
.task-time-row .mini-number-input{flex:1;min-width:88px;font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:4px}
.task-time-row .task-time-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto}

.summary-popup .box p{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.summary-popup .box .close-btn{margin-top:10px;padding:6px 16px;border-radius:8px;border:none;background:var(--border);cursor:pointer;font-size:12px}
</style>

const SPRITE_FILES=['灏忕尗鍥炬爣.jpg','灏忕尗鍥炬爣锛?锛?jpg','灏忕尗鍥炬爣锛?锛?jpg','灏忕尗鍥炬爣锛?锛?jpg'];

function loadSprites(cb){
  let loaded=0;
  SPRITE_FILES.forEach((f,i)=>{
    const img=new Image();
    img.onload=()=>{loaded++;document.getElementById('loadingSub').textContent=`鍔犺浇鍥炬爣 ${loaded}/${SPRITE_FILES.length}`;if(loaded>=SPRITE_FILES.length){spritesReady=true;cb()}};
    img.onerror=()=>{loaded++;if(loaded>=SPRITE_FILES.length){spritesReady=true;cb()}};
    img.src=f;
  });
  setTimeout(()=>{if(!spritesReady){spritesReady=true;cb()}},5000);
}
function spriteDiv(pg,r,c,size){
  const s=size||24;if(pg<0||pg>3)pg=0;
  const bgW=1440*s/480,bgH=1920*s/384;
  return `<div style="background-image:url('${SPRITE_FILES[pg]}');background-size:${bgW}px ${bgH}px;background-position:${-c*s}px ${-r*s}px;width:${s}px;height:${s}px;background-repeat:no-repeat;display:inline-block;flex-shrink:0"></div>`;

function shouldShowDaily(task){
  const base=new Date('2026-01-01'),today=new Date();today.setHours(0,0,0,0);const diff=Math.floor((today-base)/86400000);
  if(task.startDate&&todayStr()<task.startDate)return false;
  switch(task.frequency){
    case'姣忓ぉ':return true;case'闅斿ぉ':return diff%2===0;case'姣?澶?:return diff%3===0;case'宸ヤ綔鏃?:{const d=today.getDay();return d>=1&&d<=5}
    case'鑷畾涔?:{const d=today.getDay(),map=[7,1,2,3,4,5,6];return(task.customDays||[]).includes(map[d])}default:return true
  }
}

function calcTempScore(t){
  let s=(4-(t.priority||2))*2;if(t.duration)s+=Math.max(0,(60-t.duration)/10);
  const e=appData.todayStatus.energy;if(e==='馃槃')s+=3;else if(e==='馃槴')s-=3;
  const f=appData.todayStatus.freeTime;if(f==='瀹借')s+=2;else if(f==='蹇欑')s-=3;

function getWeekDays(o){const t=new Date();t.setHours(0,0,0,0);const d=t.getDay()||7;const m=new Date(t);m.setDate(t.getDate()-(d-1)+o*7);const r=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);r.push(d)}return r}
function getTasksForDate(date){
  const ds=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const today=todayStr();
  const r=[];
  appData.tasks.forEach(t=>{
    if(t.type==='姣忔棩'&&shouldShowDaily(t)&&!t.completedToday&&ds===today)r.push({color:'#64b5f6',title:t.title});

}

function renderHealth(){

  // Calculate cycle info from history
  function calcCycleStats(){
    const h=m.history.filter(x=>x.end);if(h.length<2)return null;
    const intervals=[];for(let i=1;i<h.length;i++)intervals.push(Math.round((new Date(h[i].start)-new Date(h[i-1].start))/86400000));
    const durations=h.map(x=>x.duration).filter(d=>d);
    const sortedI=[...intervals].sort((a,b)=>a-b),sortedD=[...durations].sort((a,b)=>a-b);
    const midI=sortedI[Math.floor(sortedI.length/2)],midD=sortedD[Math.floor(sortedD.length/2)];
    return {intervals,durations,medianCycle:midI,medianPeriod:midD,count:h.length};
  }
  const stats=calcCycleStats();
  const calcCycle=stats?stats.medianCycle:m.cycleDays;
  const calcPeriod=stats?stats.medianPeriod:m.periodDays;

  let html='<div class="health-card">';
  html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span class="caticon">${iconImg('鏈堢粡')}</span><span style="font-weight:600;font-size:14px">馃└ 鏈堢粡鍛ㄦ湡</span></div>`;
  if(m.lastPeriodStart){

    if(m.history.length){html+=`<details style="margin-top:6px;font-size:12px"><summary style="color:var(--text-l);cursor:pointer">鍘嗗彶璁板綍 (${m.history.length})</summary>`;m.history.slice().reverse().slice(0,6).forEach(h=>{html+=`<div style="padding:3px 0;color:var(--text-l)">${h.start} 鈫?${h.end||'杩涜涓?} (${h.duration||'?'}澶?</div>`});html+=`</details>`}
  }else{html+=`<div style="font-size:13px;color:var(--text-l);margin-bottom:8px">灏氭湭璁板綍鏈堢粡鍛ㄦ湡</div>`}
  html+=`<div class="btn-group"><button class="primary" data-action="period-start">馃搮 璁板綍寮€濮?/button>`;if(m.lastPeriodStart)html+=`<button data-action="period-end">馃搮 璁板綍缁撴潫</button>`;if(m.history.length>=2)html+=`<button data-action="period-chart">馃搳 鏌ョ湅瑙勫緥</button>`;html+=`<button data-action="period-settings">鈿欙笍 璁剧疆</button></div>`;
  // Hourly
  html+=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span class="caticon">${iconImg('鎻愰啋')}</span><span style="font-weight:600;font-size:14px">鈴?瀹氭椂鎻愰啋</span></div>`;

function calculateTotalPoints(){
  let pts=0;
  appData.tasks.forEach(t=>{
    if(t.type==='姣忔棩'&&t.lastCompletedDate)pts++;
    else if(t.type==='寰幆'&&t.lastDoneDate)pts++;
    else if(t.type==='椤圭洰'&&t.steps&&t.steps.length&&t.steps.every(s=>s.done))pts++;
  });
  return pts;
}

function checkBadges(){
  const owned=new Set((appData.badges||[]).map(b=>b.id));
  const now=todayStr();const weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay()+1);
  const stats={
    completedCount:appData.tasks.filter(t=>t.type==='姣忔棩'&&t.completedToday).length,
    totalDone:appData.tasks.filter(t=>t.type==='姣忔棩'&&t.lastCompletedDate).length+appData.tasks.filter(t=>t.type==='寰幆'&&t.lastDoneDate).length,
    weekComplete:appData.tasks.filter(t=>t.type==='姣忔棩'&&t.completedToday).length>=3,
    cyclesOnTime:appData.tasks.filter(t=>t.type==='寰幆'&&t.lastDoneDate).length,
    projectsDone:appData.tasks.filter(t=>t.type==='椤圭洰'&&t.steps&&t.steps.every(s=>s.done)).length,
  };
  let newBadges=[];
  BADGE_DEFS.forEach(def=>{
    if(owned.has(def.id))return;let earned=false;
    if(def.id==='first'&&stats.completedCount>=1)earned=true;
    if(def.id==='week7'&&stats.totalDone>=7)earned=true;
    if(def.id==='total100'&&stats.totalDone>=100)earned=true;
    if(def.id==='fullweek'&&stats.weekComplete)earned=true;
    if(def.id==='cycles5'&&stats.cyclesOnTime>=5)earned=true;
    if(def.id==='projects3'&&stats.projectsDone>=3)earned=true;
    if(earned){appData.badges.push({id:def.id,title:def.title,desc:def.desc,earnedAt:now});newBadges.push(def)}
  });
  newBadges.forEach(b=>{setTimeout(()=>showAchievementNotification(`馃弲 鑾峰緱鍕嬬珷锛乗n${b.icon} ${b.title}\n${b.desc}`),100)});
  // Star level check (after all basic badges)
  const totalPts=calculateTotalPoints();
  const curStars=appData.stars||0;
  let maxStar=0;
  STAR_LEVELS.forEach(sl=>{if(totalPts>=sl.points)maxStar=sl.level});
  if(maxStar>curStars){
    appData.stars=maxStar;
    for(let lvl=curStars+1;lvl<=maxStar;lvl++){
      const sl=STAR_LEVELS.find(s=>s.level===lvl);
      if(sl)setTimeout(()=>showAchievementNotification(`猸?杈炬垚鏄熺骇閲岀▼纰戯紒\n${sl.icon} ${sl.title}\n绱Н瀹屾垚 ${sl.points} 涓换鍔★紒`),400*(lvl-curStars));
    }
    toJSONBin();
  }
  if(newBadges.length||maxStar>curStars){renderBadges();toJSONBin()}
}
function renderBadges(){
  const c=document.getElementById('badgeList');const owned=appData.badges||[];
  const totalPts=calculateTotalPoints();const curStars=appData.stars||0;
  const cnt=document.getElementById('badgeCount');
  if(cnt)cnt.textContent=owned.length+'/'+BADGE_DEFS.length+(curStars>0?' 猸?+curStars:'');
  let html='<div class="card" style="padding:12px 14px">';
  // Badges grid
  html+='<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px">馃弲 鎴愬氨鍕嬬珷</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">';
  BADGE_DEFS.forEach(def=>{
    const has=owned.find(b=>b.id===def.id);
    html+=`<div style="width:80px;text-align:center;padding:8px 4px;border-radius:10px;background:${has?'var(--green-l)':'var(--border)'};opacity:${has?'1':'.4'}"><div style="font-size:24px">${def.icon}</div><div style="font-size:10px;color:var(--text);margin-top:4px;font-weight:${has?'600':'400'}">${def.title}</div>${has?`<div style="font-size:8px;color:var(--text-l)">${has.earnedAt}</div>`:'<div style="font-size:8px;color:#bbb">鏈幏寰?/div>'}</div>`;
  });
  html+='</div>';
  // Star levels progress
  html+='<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">';
  html+='<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px">猸?鏄熺骇閲岀▼纰?/div>';
  const nextStar=STAR_LEVELS.find(sl=>sl.level>curStars);
  if(nextStar){
    const progress=Math.min(100,(totalPts/nextStar.points)*100);
    html+=`<div style="margin-bottom:6px;font-size:11px;color:var(--text-l)">鐩墠 ${totalPts} / ${nextStar.points} 鍒?鈫?${nextStar.icon} ${nextStar.title}</div>`;

function renderExtra(){const items=(appData.notes||[]).filter(n=>n.done&&n.date===todayStr());const cnt=document.getElementById('extraCount');if(cnt)cnt.textContent=items.length;const list=document.getElementById('extraList');if(!items.length){if(list)list.innerHTML='<div class="empty-tip" style="padding:4px 0;font-size:12px">鏆傛棤</div>';return}if(list)list.innerHTML=items.slice(0,5).map(i=>'<div style="padding:4px 8px;font-size:12px;color:var(--text-l);border-bottom:1px solid var(--border)">馃摑 '+esc(i.text)+'</div>').join('')+(items.length>5?'<div style="padding:4px 8px;font-size:11px;color:#bbb">杩樻湁'+(items.length-5)+'鏉?..</div>':'')}
